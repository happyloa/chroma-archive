name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      # 憲章第 3 條：打包大小預算
      - run: npm run size
      # 可及性、SEO、LCP、CLS 門檻（lighthouserc.json）
      - run: npm run lhci
      - name: Lighthouse 摘要（LCP 元素與長任務）
        if: always()
        run: node scripts/lhci-summary.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          # 以 . 開頭的資料夾預設不上傳
          include-hidden-files: true
          retention-days: 7

  # 和 quality 同時跑：Playwright 的 webServer 會自己 build，不需要等 quality 的產物
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
